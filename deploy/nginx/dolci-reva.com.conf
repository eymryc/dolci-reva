# Dolci Rêva — un seul domaine : dolci-reva.com
# - Next.js (PM2)  → 127.0.0.1:3001  (:3000 = autre app folioas-web)
# - Laravel Docker  → 127.0.0.1:8080
#
# Routage :
#   /api/backend, /api/auth, /api/webhooks  → Next (BFF)
#   /api/*                                  → Laravel
#   /storage/*, /images/*                     → Laravel (médias + logos mails)
#   tout le reste                             → Next

upstream dolci_front {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream dolci_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dolci-reva.com www.dolci-reva.com;

    client_max_body_size 36M;

    # --- BFF / routes Next sous /api ---
    location ^~ /api/backend {
        proxy_pass http://dolci_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /api/auth {
        proxy_pass http://dolci_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /api/webhooks {
        proxy_pass http://dolci_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --- API Laravel (Docker nginx sur :8080) ---
    location /api/ {
        proxy_pass http://dolci_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location = /up {
        proxy_pass http://dolci_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spatie media + assets mails
    location ^~ /storage/ {
        proxy_pass http://dolci_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        access_log off;
    }

    location ^~ /images/ {
        proxy_pass http://dolci_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        access_log off;
    }

    # --- Front Next.js ---
    location / {
        proxy_pass http://dolci_front;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

# SSL via Certbot :
#   sudo certbot --nginx -d dolci-reva.com -d www.dolci-reva.com
